name: Pruebas automatizadas

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      perfil:
        description: "Perfil Maven a ejecutar (smoke, ui, api, api-requeridos, api-adicionales, defectos)"
        required: false
        default: ""
  schedule:
    - cron: "17 11 * * 1-5"   # regresión diaria L-V (06:17 hora Colombia)

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [ ui, api ]
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Instalar Chrome
        if: matrix.suite == 'ui'
        uses: browser-actions/setup-chrome@v2

      - name: Ejecutar pruebas (${{ matrix.suite }})
        env:
          REQRES_API_KEY: ${{ secrets.REQRES_API_KEY }}
        run: mvn -B clean verify -P${{ github.event.inputs.perfil || matrix.suite }}

      - name: Publicar reporte Serenity
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-serenity-${{ matrix.suite }}
          path: |
            target/site/serenity/
            target/reporte/
          retention-days: 14
