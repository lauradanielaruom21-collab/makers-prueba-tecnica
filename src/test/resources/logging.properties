# Configuración de java.util.logging (la usa Selenium).
handlers = java.util.logging.ConsoleHandler
.level = INFO
java.util.logging.ConsoleHandler.level = INFO
# Aviso informativo cuando Chrome es más nuevo que el soporte CDP del Selenium incluido: no afecta las pruebas.
org.openqa.selenium.devtools.level = SEVERE
org.openqa.selenium.chromium.level = SEVERE
