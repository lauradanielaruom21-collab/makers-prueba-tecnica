# Desde el IDE (runners) Chrome se ve. Maven lo sobreescribe: headless por defecto,
# visible con -Prequeridos, -Padicionales, -Ptodos o -Pheaded.
headless.mode = false

serenity {
  project.name = "Makers - Prueba Técnica QA"
  tag.failures = "true"
  linked.tags = "issue"
  logging = VERBOSE
  # Captura en cada paso de UI: el reporte queda como evidencia de ejecución
  take.screenshots = AFTER_EACH_STEP
  report.encoding = "UTF-8"
  console.colors = true
}

webdriver {
  driver = chrome
  base.url = "https://www.saucedemo.com"
  autodownload = true
  wait.for.timeout = 10000
  timeouts {
    implicitlywait = 0
    fluentwait = 10000
  }
  capabilities {
    browserName = "chrome"
    acceptInsecureCerts = true
    "goog:chromeOptions" {
      args = ["remote-allow-origins=*", "start-maximized", "incognito", "disable-infobars",
              "disable-gpu", "disable-dev-shm-usage", "no-sandbox", "window-size=1440,900",
              "disable-features=PasswordLeakDetection"]
      prefs {
        "credentials_enable_service" = false
        "profile.password_manager_enabled" = false
        "profile.password_manager_leak_detection" = false
      }
    }
  }
}
